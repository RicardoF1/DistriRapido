# Green IT & Performance Audit (v1.0.0)
# Levanta DistriRapido como en producción (PostgreSQL efímero, API NestJS y build de Vite servido por
# nginx con src/frontend/nginx.conf) y ejecuta Lighthouse CI con los umbrales de la rúbrica.
# Los informes se conservan como artefacto privado del workflow; no se publican en servicios externos.
name: Green IT & Performance Audit

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: green-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: green_audit
          POSTGRES_DB: distrirapido_audit
          # Solo servicio efímero del runner, sin credenciales versionadas.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U green_audit -d distrirapido_audit"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://green_audit@localhost:5432/distrirapido_audit
      FRONTEND_ORIGIN: http://localhost:5173
      VITE_API_URL: http://localhost:3000
      BOOTSTRAP_ADMIN_EMAIL: lhci-admin@example.test
      LHCI_VERSION: 0.15.1
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            src/backend/package-lock.json
            src/frontend/package-lock.json

      - name: Generate ephemeral secrets
        run: |
          node -e "const c=require('crypto');const s=c.randomBytes(48).toString('hex');const p='Lhci-'+c.randomBytes(18).toString('base64url');console.log('::add-mask::'+s);console.log('::add-mask::'+p);require('fs').appendFileSync(process.env.GITHUB_ENV,'JWT_SECRET='+s+'\nBOOTSTRAP_ADMIN_PASSWORD='+p+'\n')"

      - name: Verify SWDM v4 calculation
        run: node --test scripts/swdm-v4.test.cjs

      - name: Build and start API
        working-directory: src/backend
        run: |
          npm ci
          npm run prisma:generate
          npm run db:migrate
          npm run db:bootstrap
          npm run build
          nohup node dist/main.js > "$RUNNER_TEMP/backend.log" 2>&1 &
          for attempt in $(seq 1 30); do
            status=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/auth/me || true)
            [ "$status" = "401" ] && echo "API disponible" && exit 0
            sleep 2
          done
          echo "La API no respondió a tiempo" >&2
          cat "$RUNNER_TEMP/backend.log" >&2
          exit 1

      - name: Build frontend
        working-directory: src/frontend
        run: |
          npm ci
          npm run build

      - name: Serve frontend with production nginx configuration
        run: |
          docker run -d --name green-audit-web -p 5173:80 \
            -v "$GITHUB_WORKSPACE/src/frontend/dist:/usr/share/nginx/html:ro" \
            -v "$GITHUB_WORKSPACE/src/frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro" \
            nginx:1.28-alpine
          for attempt in $(seq 1 15); do
            curl -sf -o /dev/null http://localhost:5173/login && echo "nginx disponible" && exit 0
            sleep 1
          done
          docker logs green-audit-web >&2
          exit 1

      - name: Install Lighthouse CI
        run: npm install -g "@lhci/cli@${LHCI_VERSION}"

      - name: Audit public page (login)
        run: |
          lhci collect --url=http://localhost:5173/login
          lhci assert
          lhci upload --upload.outputDir=.lighthouseci/reports/publicas

      - name: Audit authenticated pages
        run: |
          rm -rf .lighthouseci/lhr-*.json
          curl -sf -c "$RUNNER_TEMP/cookies.txt" -o /dev/null \
            -H "Origin: http://localhost:5173" -H "Content-Type: application/json" \
            -d "{\"email\":\"${BOOTSTRAP_ADMIN_EMAIL}\",\"password\":\"${BOOTSTRAP_ADMIN_PASSWORD}\"}" \
            http://localhost:3000/auth/login
          cookie=$(awk '$6=="distrirapido_session_v2"{print $7}' "$RUNNER_TEMP/cookies.txt")
          echo "::add-mask::${cookie}"
          lhci collect \
            --url=http://localhost:5173/acceso/administrador \
            --url=http://localhost:5173/seguimiento \
            --settings.extraHeaders="{\"Cookie\":\"distrirapido_session_v2=${cookie}\"}"
          lhci assert
          lhci upload --upload.outputDir=.lighthouseci/reports/autenticadas

      - name: Upload Lighthouse reports (private workflow artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports
          path: .lighthouseci/reports
          retention-days: 14
          if-no-files-found: ignore

      - name: Show API log on failure
        if: failure()
        run: cat "$RUNNER_TEMP/backend.log" || true
