# Plantilla: la imagen oficial de nginx sustituye ${PORT} y ${API_UPSTREAM} al arrancar
# (/etc/nginx/templates). Las variables propias de nginx ($uri, $scheme…) no se tocan.
server {
  listen ${PORT};
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Green IT (área 8): se sirven los .gz generados en el build (gzip_static, sin coste de CPU por petición)
  # y, para cualquier otro texto, compresión gzip dinámica. La imagen oficial de nginx no incluye Brotli;
  # Brotli se aplica en las respuestas de la API (NestJS).
  gzip on;
  gzip_static on;
  gzip_vary on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_types text/css application/javascript application/json application/geo+json image/svg+xml text/plain;

  # Cabeceras de seguridad. Se repiten en cada location porque add_header en un bloque anidado
  # reemplaza las heredadas del servidor.
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data: https://tile.openstreetmap.org; connect-src 'self' https://photon.komoot.io; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

  # Green IT (área 7): recursos con hash en el nombre, inmutables durante un año.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data: https://tile.openstreetmap.org; connect-src 'self' https://photon.komoot.io; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    try_files $uri =404;
  }

  # Cobertura versionada (v1) y verificada por SHA-256 en el cliente: caché de un día con revalidación por ETag.
  location /geodata/ {
    types { application/geo+json geojson; application/json json; }
    add_header Cache-Control "public, max-age=86400" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data: https://tile.openstreetmap.org; connect-src 'self' https://photon.komoot.io; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    try_files $uri =404;
  }

  # El documento de la SPA se revalida siempre para recoger nuevos despliegues.
  location = /index.html {
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data: https://tile.openstreetmap.org; connect-src 'self' https://photon.komoot.io; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
  }

  # API en el mismo origen: /api/* se reenvía al backend sin el prefijo. Así la cookie de sesión
  # (SameSite=Lax) viaja en cada petición aunque el backend esté en otro dominio, y la CSP solo
  # necesita 'self'. Host queda como el del backend ($proxy_host), que es lo que espera Render.
  location /api/ {
    proxy_pass ${API_UPSTREAM}/;
    proxy_http_version 1.1;
    proxy_ssl_server_name on;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 90s;
    client_max_body_size 1m;
  }

  location / { try_files $uri $uri/ /index.html; }
}
